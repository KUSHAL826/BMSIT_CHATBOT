name: Schedule Test - GitHub Scheduler

on:
  push:
    branches:
      - main
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u)"
