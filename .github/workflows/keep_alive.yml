```yaml
name: Keep Alive Render & Supabase

on:
  schedule:
    # 1:27 PM IST = 07:57 UTC, every Tuesday and Friday
    - cron: '57 7 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping Render and Verify Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ==========================================
      # STEP 1: PING RENDER
      # ==========================================
      - name: Ping Render Health Endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        shell: bash
        run: |
          echo "=========================================="
          echo "STEP 1: Render Health Check"
          echo "Time (UTC): $(date -u)"
          echo "=========================================="

          if [ -z "$RENDER_APP_URL" ]; then
            echo "WARNING: RENDER_APP_URL is not configured."
            exit 0
          fi

          RENDER_URL="${RENDER_APP_URL%/}/healthz"

          if HTTP_CODE=$(curl -sS -L \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            -o /tmp/render_response.txt \
            -w "%{http_code}" \
            "$RENDER_URL"); then

            echo "Render HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "SUCCESS: Render health endpoint responded."
            else
              echo "WARNING: Render returned HTTP $HTTP_CODE."
            fi
          else
            echo "WARNING: Render health endpoint could not be reached."
          fi

      # ==========================================
      # STEP 2: VERIFY SUPABASE TABLE
      # ==========================================
      - name: Verify Supabase Database Query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        shell: bash
        run: |
          set -uo pipefail

          echo ""
          echo "=========================================="
          echo "STEP 2: Supabase Database Verification"
          echo "Time (UTC): $(date -u)"
          echo "=========================================="

          # Check required secrets
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_KEY is missing."
            exit 1
          fi

          # Remove a trailing slash from the project URL
          SUPABASE_URL="${SUPABASE_URL%/}"

          # Default table is vectors
          TABLE="${SUPABASE_TABLE:-vectors}"

          # Validate table name to prevent URL injection
          if [[ ! "$TABLE" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
            echo "ERROR: Invalid SUPABASE_TABLE value."
            exit 1
          fi

          echo "Supabase URL: $SUPABASE_URL"
          echo "Table: $TABLE"
          echo "Testing DNS resolution..."

          HOST=$(printf '%s' "$SUPABASE_URL" |
            sed -E 's#^https?://([^/]+).*#\1#')

          if [ -z "$HOST" ]; then
            echo "ERROR: SUPABASE_URL is not a valid HTTP(S) URL."
            exit 1
          fi

          if ! getent hosts "$HOST"; then
            echo "WARNING: DNS lookup failed on the first attempt."
            echo "The hostname may be unavailable or the project may be paused."
          else
            echo "SUCCESS: Supabase hostname resolved."
          fi

          # Query one row from the actual table.
          # This verifies access to the table, not just the API root.
          PING_URL="${SUPABASE_URL}/rest/v1/${TABLE}?select=*&limit=1"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="000"

          echo ""
          echo "Sending authenticated query to Supabase..."
          echo "Retries: up to 3 attempts after the initial request."

          if HTTP_CODE=$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            "$PING_URL"); then

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "SUCCESS: Supabase accepted the database query."
              echo "SUCCESS: Table '$TABLE' is accessible."
              echo "Response preview (maximum 500 characters):"
              head -c 500 "$RESPONSE_FILE"
              echo ""
              echo "DATABASE CHECK PASSED."
              rm -f "$RESPONSE_FILE"
            else
              echo "ERROR: Supabase returned HTTP $HTTP_CODE."
              echo "Response details (maximum 1000 characters):"
              head -c 1000 "$RESPONSE_FILE"
              echo ""
              rm -f "$RESPONSE_FILE"
              exit 1
            fi

          else
            CURL_EXIT=$?
            echo "ERROR: Supabase request failed."
            echo "curl exit code: $CURL_EXIT"
            echo "HTTP status: ${HTTP_CODE:-000}"
            echo "Check DNS, project status, URL, network and timeout."
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

      # ==========================================
      # STEP 3: FINAL SUMMARY
      # ==========================================
      - name: Verification Summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "KEEP-ALIVE WORKFLOW COMPLETED"
          echo "Render health check completed."
          echo "Supabase table query succeeded."
          echo "Time (UTC): $(date -u)"
          echo "=========================================="
```
