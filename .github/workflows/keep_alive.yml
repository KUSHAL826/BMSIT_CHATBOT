name: Keep Alive Render & Supabase

on:
  schedule:
    # 1:27 PM IST (07:57 UTC), every Tuesday and Friday
    - cron: '57 7 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping Render and Verify Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ==========================================
      # STEP 1: RENDER HEALTH CHECK
      # ==========================================
      - name: Check Render Health
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        shell: bash
        run: |
          echo "STEP 1: Checking Render..."

          if [ -z "$RENDER_APP_URL" ]; then
            echo "WARNING: RENDER_APP_URL is not configured."
            exit 0
          fi

          RENDER_URL="${RENDER_APP_URL%/}/healthz"

          HTTP_CODE=$(curl -s -L \
            --connect-timeout 10 \
            --max-time 25 \
            --retry 2 \
            --retry-all-errors \
            -o /dev/null \
            -w "%{http_code}" \
            "$RENDER_URL" || true)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "SUCCESS: Render is responding."
          else
            echo "WARNING: Render returned HTTP ${HTTP_CODE:-000}."
          fi

      # ==========================================
      # STEP 2: SUPABASE DATABASE CHECK
      # ==========================================
      - name: Verify Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        shell: bash
        run: |
          set -euo pipefail

          echo "STEP 2: Checking Supabase database..."

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: Supabase URL or key is missing."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"
          TABLE="${SUPABASE_TABLE:-vectors}"

          if [[ ! "$TABLE" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
            echo "ERROR: Invalid table name."
            exit 1
          fi

          echo "Checking database connectivity..."

          # Read only the ID of one row.
          # Discard the response body to avoid printing database data.
          PING_URL="${SUPABASE_URL}/rest/v1/${TABLE}?select=id&limit=1"

          HTTP_CODE=$(curl -s \
            --connect-timeout 10 \
            --max-time 25 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 3 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            -o /dev/null \
            -w "%{http_code}" \
            "$PING_URL" || true)

          echo "Supabase HTTP status: ${HTTP_CODE:-000}"

          if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "SUCCESS: Supabase database is reachable."
            echo "SUCCESS: Table '${TABLE}' query completed."
          else
            echo "ERROR: Supabase database check failed."
            echo "Check project status, URL, API key and table permissions."
            exit 1
          fi

      # ==========================================
      # STEP 3: SUMMARY
      # ==========================================
      - name: Final Status
        if: success()
        shell: bash
        run: |
          echo "=================================="
          echo "KEEP-ALIVE CHECK COMPLETED"
          echo "Render health check completed."
          echo "Supabase database query succeeded."
          echo "No database rows were printed."
          echo "=================================="
