<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official AI assistant for B.M.S. Institute of Technology and Management, Bengaluru. Ask about admissions, courses, placements, hostels and campus life.">
  <title>Ask BMSIT &middot; Official AI Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to the question box</a>

  <div class="shell">
    <!-- Official BMSIT Chatbot Header -->
    <header class="college-header">
      <div class="header-left">
        <span class="status-pill" id="kb-status" role="status" title="Knowledge Base Connected">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">Ready</span>
        </span>
      </div>
      <div class="header-actions">
        <button type="button" class="new-chat-button ghost-button" id="clear-chat" title="Start a fresh conversation">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>New chat</span>
        </button>
      </div>
    </header>

    <main class="conversation" id="conversation" role="log" aria-live="polite" aria-label="Conversation">
      <section class="welcome" id="welcome">
        <h2>How can I help with BMSIT today?</h2>

        <div class="suggestions" id="suggestions">
          <button type="button" class="suggestion" data-q="What engineering branches and courses are offered at BMSIT?">
            <span class="suggestion-icon" aria-hidden="true">&#127891;</span>
            <span>
              <strong>Courses &amp; branches</strong>
              <small>What programmes can I apply for?</small>
            </span>
          </button>
          <button type="button" class="suggestion" data-q="How do I apply for admission to BMSIT and what is the eligibility?">
            <span class="suggestion-icon" aria-hidden="true">&#128221;</span>
            <span>
              <strong>Admissions</strong>
              <small>KCET, COMEDK and eligibility</small>
            </span>
          </button>
          <button type="button" class="suggestion" data-q="What are the placement statistics and top recruiters at BMSIT?">
            <span class="suggestion-icon" aria-hidden="true">&#128200;</span>
            <span>
              <strong>Placements</strong>
              <small>Packages and recruiters</small>
            </span>
          </button>
          <button type="button" class="suggestion" data-q="Tell me about BMSIT hostel facilities and campus amenities">
            <span class="suggestion-icon" aria-hidden="true">&#127968;</span>
            <span>
              <strong>Hostel &amp; campus</strong>
              <small>Facilities and daily life</small>
            </span>
          </button>
        </div>
      </section>
    </main>

    <footer class="composer">
      <form id="composer" autocomplete="off">
        <label class="sr-only" for="composer-input">Ask a question about BMSIT</label>
        <textarea
          id="composer-input"
          name="message"
          rows="1"
          maxlength="2000"
          placeholder="Ask about admissions, fees, placements, hostels..."
          aria-describedby="composer-hint"></textarea>
        <button type="button" id="voice-button" aria-label="Ask with voice" title="Voice Input (Click to speak)">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button type="submit" id="send-button" aria-label="Send question">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.39 1.2l2.06 6.16a1 1 0 00.84.68l8.66.86-8.66.86a1 1 0 00-.84.68L2.01 19.2a1 1 0 001.39 1.2z"/>
          </svg>
        </button>
      </form>
      <p class="composer-hint" id="composer-hint">
        Answers come from official BMSIT sources. For decisions, confirm with the college:
        <a href="mailto:admissions@bmsit.in">admissions@bmsit.in</a> &middot;
        <a href="tel:+918068730444">+91 80 6873 0444</a>
      </p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
